<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth HQ — integrazione bundle singolo</title><style>body{margin:0;background:#b9cddc;font:14px sans-serif}canvas{display:block}#status{position:fixed;bottom:18px;left:18px;color:white;text-shadow:0 1px 4px #000;max-width:90vw}#credits{position:fixed;bottom:18px;right:18px;color:white;font-size:10px;text-shadow:0 1px 4px #000}</style><body><div id="status">Caricamento HQ…</div><div id="credits"></div><script src="../dist/earth-hq.bundle.js"></script><script>
const {THREE,EarthHQStreaming,geoToECEF}=EarthHQ;
const renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9cddc);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,1e8),lat=41.88931,lon=12.49223,target=geoToECEF(lat,lon),up=target.clone().normalize(),east=new THREE.Vector3(-Math.sin(lon*Math.PI/180),Math.cos(lon*Math.PI/180),0);
camera.position.copy(target).addScaledVector(up,100).addScaledVector(east,70);camera.up.copy(up);camera.lookAt(target);
const tiles=new EarthHQStreaming({renderer,radiusMeters:100,retainRadiusMeters:200});scene.add(tiles.group);
const status=document.getElementById('status'),credits=document.getElementById('credits');tiles.addEventListener('progress',({coverage:c})=>{status.textContent=c.readyLeaves+' / '+c.requiredLeaves+' tile · '+c.status;credits.textContent=tiles.getAttribution();});tiles.addEventListener('error',({error})=>{status.textContent=error.message;});
tiles.start().then(()=>{renderer.setAnimationLoop(()=>{tiles.update(camera,{focusECEF:target});renderer.render(scene,camera);});}).catch(e=>status.textContent=e.message);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
