<!doctype html><html lang="en"><meta charset="utf-8"><title>Tile API integration</title>
<script src="../dist/earth-hq.bundle.js"></script><script>
// No UI, canvas, rendering library or automatically started animation loop.
const engine=new EarthHQ.EarthTileEngine();
engine.addEventListener('tile-load',({layer,tile})=>{
 if(layer==='3d')console.log('3D mesh arrays, textures and transform',tile);
 else console.log('2D image bytes and geographic bounds',tile);
});
engine.addEventListener('error',({layer,error})=>console.error(layer,error));
const target=EarthHQ.geoToECEF(41.88931,12.49223),up=target.clone().normalize();
const camera={position:target.clone().addScaledVector(up,150).toArray(),direction:up.clone().multiplyScalar(-1).toArray(),up:[0,0,1],fovYDegrees:52,viewportWidth:960,viewportHeight:600};
engine.start().then(()=>engine.update(camera));
// In your host's frame loop: engine.update(camera). On shutdown: await engine.dispose().
window.engine=engine;
</script></html>
